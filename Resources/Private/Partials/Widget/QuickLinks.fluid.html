<html
    xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    data-namespace-typo3-fluid="true"
>

<f:if condition="{payload.customLinks}">
    <h3 class="jw-label jw-links__heading"><f:translate key="jw_dashboard.messages:widget.quickLinks.project" /></h3>
    <ul class="jw-links">
        <f:for each="{payload.customLinks}" as="link">
            <li>
                <f:if condition="{link.external}">
                    <f:then>
                        <a href="{link.url}" class="jw-links__link" target="_blank" rel="noopener noreferrer">
                            <core:icon identifier="{link.icon}" size="small" />
                            <span class="jw-links__label">{link.label}</span>
                            <core:icon identifier="actions-window-open" size="small" />
                        </a>
                    </f:then>
                    <f:else>
                        <a href="{link.url}" class="jw-links__link">
                            <core:icon identifier="{link.icon}" size="small" />
                            <span class="jw-links__label">{link.label}</span>
                        </a>
                    </f:else>
                </f:if>
            </li>
        </f:for>
    </ul>
</f:if>

<f:if condition="{payload.moduleLinks}">
    <h3 class="jw-label jw-links__heading"><f:translate key="jw_dashboard.messages:widget.quickLinks.backend" /></h3>
    <ul class="jw-links">
        <f:for each="{payload.moduleLinks}" as="link">
            <li>
                <a href="{link.url}" class="jw-links__link">
                    <core:icon identifier="{link.icon}" size="small" />
                    <span class="jw-links__label">{f:translate(key: link.label, default: link.label)}</span>
                </a>
            </li>
        </f:for>
    </ul>
</f:if>

</html>
