services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  JWeiland\JwDashboard\:
    resource: '../Classes/*'
    exclude:
      - '../Classes/Domain/Model/*'
      # Core dashboard widgets depend on the optional EXT:dashboard, see Services.php
      - '../Classes/CoreDashboard/*'

  # Widgets are collected via the "jw_dashboard.widget" tag (see WidgetInterface)

  JWeiland\JwDashboard\Controller\DashboardController:
    public: true

  JWeiland\JwDashboard\Controller\Ajax\WidgetRefreshController:
    public: true
